name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # request the GitHub OIDC token for NuGet Trusted Publishing

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # nuget.org account that owns the package and the Trusted Publishing policy.
  # This is public information (it is your package owner name), not a secret.
  NUGET_USER: podgito

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget-release   # must match the Environment field on the nuget.org Trusted Publishing policy
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify tag matches project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(dotnet msbuild DataTableMapper/DataTableMapper.csproj \
                   -getProperty:Version -p:TargetFramework=net10.0 | tr -d '[:space:]')
          echo "tag=$TAG project=$PROJ"
          if [ "$TAG" != "$PROJ" ]; then
            echo "::error::Tag '$TAG' does not match <Version> '$PROJ' in Directory.Build.props"
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack DataTableMapper/DataTableMapper.csproj -c Release --no-build -o artifacts

      - name: NuGet login (OIDC -> short-lived API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          generate_release_notes: true
