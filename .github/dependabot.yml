version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      test-dependencies:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "NUnit*"
          - "Shouldly"
    ignore:
      - dependency-name: "NUnit"
        versions: [ ">=4.0.0" ]
      - dependency-name: "NUnit3TestAdapter"
        versions: [ ">=5.0.0" ]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
